# 门禁 CI：跑仓库自己的一条验全命令 `npm run verify`
# （= typecheck + test + build，见 AGENTS.md「技术栈与命令」）。
# 不另写一套检查，避免 CI 与本机门禁各说各话。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支连推时只留最后一次，省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # package.json 的 engines 声明 node >= 20，这里就按这个下限验，
      # 保证声明的最低版本真的能构建。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 有 package-lock.json，用 npm ci 保证与锁文件一致。
      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify
