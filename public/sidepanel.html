<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tranlithion 侧边栏翻译</title>
    <link rel="stylesheet" href="sidepanel/sidepanel.css" />
  </head>
  <body>
    <main class="panel" aria-labelledby="panel-title">
      <header class="panel-header">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
          <div>
            <h1 id="panel-title">侧边栏翻译</h1>
            <p id="target-label">正在读取设置…</p>
          </div>
        </div>
        <button id="clear-entries" class="text-button" type="button">清空</button>
      </header>

      <form id="composer" class="composer">
        <label class="visually-hidden" for="composer-text">要翻译的文字</label>
        <textarea
          id="composer-text"
          rows="3"
          spellcheck="false"
          placeholder="粘贴或输入文字，Ctrl / ⌘ + Enter 翻译"
        ></textarea>
        <div class="composer-row">
          <label class="visually-hidden" for="composer-source">原文语言</label>
          <select id="composer-source">
            <option value="auto">自动识别原文语言</option>
            <option value="ja">日语</option>
            <option value="en">英语</option>
            <option value="zh-CN">简体中文</option>
          </select>
          <button id="composer-submit" class="primary-button" type="submit">翻译</button>
        </div>
      </form>

      <div id="activation" class="activation" hidden>
        <p>Chrome 需要你点一下，才能在扩展里启用本地翻译模型（第一次使用这个语言对时）。</p>
        <button id="activate" class="primary-button" type="button">启用本地翻译</button>
      </div>
      <p id="panel-status" class="panel-status" role="status" aria-live="polite"></p>

      <section class="entries-section" aria-labelledby="entries-heading">
        <h2 id="entries-heading" class="visually-hidden">译文</h2>
        <ol id="entries" class="entries"></ol>
        <p id="empty-state" class="empty-state">
          在网页上选中文字，点「侧边栏」，或右键选择「在侧边栏翻译」，译文会出现在这里。
        </p>
      </section>

      <footer class="panel-footer">
        <p id="destination"></p>
        <p>这里的译文只保留到关闭侧边栏为止，不写入任何存储。</p>
      </footer>
    </main>
    <script type="module" src="sidepanel/index.js"></script>
  </body>
</html>
